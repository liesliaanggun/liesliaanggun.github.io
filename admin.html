<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk Admin | SAGA Water</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f8f6;color:#173b37;font-family:system-ui;display:grid;place-items:center;padding:22px}.card{width:min(100%,440px);background:white;border:1px solid #e0ebe7;border-radius:20px;padding:30px;box-shadow:0 18px 55px #164c3a0d}.brand{font-size:22px;font-weight:800;color:#087b6a}.brand span{display:inline-grid;place-items:center;background:#087b6a;color:white;border-radius:9px;width:32px;height:32px;margin-right:8px}h1{font-size:25px;margin:24px 0 0}.sub,.hint{color:#718681;line-height:1.55}label{display:block;font-weight:650;font-size:13px;margin:15px 0 7px}input{width:100%;border:1px solid #dce8e3;border-radius:11px;padding:13px 14px;font:inherit}input:focus{outline:2px solid #b9e4d9;border-color:#087b6a}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:10px;background:#087b6a;color:white;padding:12px 17px;font-weight:700;cursor:pointer}.secondary{background:#e8f3ef;color:#176b5c}.text{background:transparent;color:#087b6a;padding-left:0}.hint,.message{font-size:12px;line-height:1.55;margin-top:16px}.message{font-size:13px;white-space:pre-wrap}.error{color:#c0392b}.success{color:#087b6a}.back{display:inline-block;color:#087b6a;text-decoration:none;font-size:13px;margin-top:20px}.adminOnly{border-top:1px solid #edf2ef;margin-top:18px;padding-top:5px}</style></head><body><main class="card"><div class="brand"><span>S</span>Uinsagawater</div><h1>Masuk admin</h1><p class="sub">Halaman ini khusus administrator. Website utama SAGA Water tetap dapat diakses semua orang.</p><label for="email">Email admin</label><input id="email" type="email" value="sagawater@gmail.com" autocomplete="username"><label for="password">Kata sandi</label><input id="password" type="password" placeholder="Minimal 8 karakter" autocomplete="current-password"><div class="buttons"><button id="login">Masuk</button><button id="signup" class="secondary">Buat akun admin</button></div><div class="adminOnly"><button id="reset" class="text">Lupa kata sandi? Kirim tautan reset</button></div><p class="hint">Gunakan email sagawater@gmail.com. Kata sandi minimal 8 karakter. Jangan bagikan kata sandi kepada siapa pun.</p><p id="message" class="message"></p><a class="back" href="./">← Kembali ke website SAGA Water</a></main><script>
const client=window.supabase.createClient('https://aswuejsphphfptsozoer.supabase.co','sb_publishable_4UaHcJ-mWTIE9ToC8vb-6A_rovGDQfN');const $=id=>document.getElementById(id),admin='sagawater@gmail.com';function say(t,ok=false){$('message').className='message '+(ok?'success':'error');$('message').textContent=t}function creds(){const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(email!==admin){say('Gunakan email admin sagawater@gmail.com.');return null}if(password.length<8){say('Kata sandi terlalu pendek. Masukkan minimal 8 karakter.');return null}return{email,password}}
$('signup').onclick=async()=>{const c=creds();if(!c)return;say('Sedang membuat akun...',true);const{data,error}=await client.auth.signUp({email:c.email,password:c.password,options:{emailRedirectTo:location.origin+'/admin.html'}});if(error){say('Pendaftaran gagal: '+error.message);return}say(data.session?'Akun berhasil dibuat dan Anda sudah masuk.':'Pendaftaran diterima. Periksa email untuk konfirmasi, lalu kembali ke halaman ini untuk masuk.',true)};
$('login').onclick=async()=>{const c=creds();if(!c)return;say('Memeriksa akun...',true);const{data,error}=await client.auth.signInWithPassword(c);if(error){say('Login gagal: '+error.message);return}say('Berhasil masuk sebagai '+data.user.email+'. Dashboard belum diaktifkan.',true)};
$('reset').onclick=async()=>{if($('email').value.trim().toLowerCase()!==admin){say('Gunakan email sagawater@gmail.com.');return}const{error}=await client.auth.resetPasswordForEmail(admin,{redirectTo:location.origin+'/admin.html'});say(error?'Gagal mengirim tautan: '+error.message:'Tautan reset dikirim. Periksa inbox dan folder spam email sagawater@gmail.com.',!error)};
client.auth.getSession().then(({data})=>{if(data.session?.user?.email===admin)say('Anda sudah masuk sebagai '+admin+'. Dashboard belum diaktifkan.',true)});
</script></body></html>
